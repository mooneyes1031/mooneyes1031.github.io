# ---------------------------------------------------------------------------
# 评论系统（giscus）
#
# 已启用：GitHub Discussions 已开启，giscus App 已授权，分类使用 General。
# 文章评论和「留言板」共用同一个 Discussion 分类，访客需要登录 GitHub 才能发言。
# 如果以后换仓库或分类，按下面步骤重新生成：
#   1. 仓库 → Settings → General → Features → 勾选 Discussions
#   2. https://github.com/apps/giscus 安装并授权你的博客仓库
#   3. https://giscus.app/zh-CN 填仓库名，选分类，把生成的 categoryID 填到下面
#
# categoryID 为空时，文章底部不会显示评论区，也不会报错。
# ---------------------------------------------------------------------------
[params.giscus]
  repo = "mooneyes1031/mooneyes1031.github.io"
  repoID = "R_kgDOVPRXyA"
  category = "General"
  categoryID = "DIC_kwDOVPRXyM4DKfbi"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "preferred_color_scheme"
  lang = "zh-CN"
  loading = "lazy"

# ---------------------------------------------------------------------------
# 访问统计（默认关闭，全部留空 = 不加载任何脚本）
# 支持：fathom / plausible / goatcounter / cloudflare / counterdev / matomo
#        googleTagManager / umami / pirsch / microAnalytics
#
# 推荐先用 GoatCounter（免费、无 Cookie、无广告）：
#   1. 到 https://www.goatcounter.com/ 注册，得到一个站点代码（比如 moonblog）
#   2. 把代码填到下面的 code，提交推送即可
#
# 或者用 Umami（可自建，也可以使用托管服务）：
#   1. 在 Umami 后台新建网站，复制 Website ID 和脚本地址
#   2. 填到下面 siteID / scriptURL
#
# 两个都留空时，页面不会加载任何统计脚本。
# ---------------------------------------------------------------------------
[params.goatCounter]
  code = ""

[params.umami]
  siteID = ""
  scriptURL = ""
