# ==========================================================================
#  Hugo Coder 站点配置
#  带 ★ 的项是需要你改的
#  格式说明：TOML，字符串用双引号，布尔值写 true / false，不需要缩进对齐
# ==========================================================================

# ★ 站点地址。必须带 https:// 且结尾有斜杠
baseURL = "https://mooneyes1031.github.io/"

# ★ 站点标题：显示在页面左上角和浏览器标签
title = "無限月読の世界"

# 主题名（对应 themes/ 下的文件夹名，不要动）
theme = "hugo-coder"

# 内容语言：zh-cn = 简体中文
locale = "zh-cn"
defaultContentLanguage = "zh-cn"

# 按中文习惯统计字数和阅读时间（中文没有空格，不开这个阅读时间会算错）
hasCJKLanguage = true

# 允许在正文里直接用 emoji 短代码，如 :smile:
enableEmoji = true

# 自动生成 robots.txt
enableRobotsTXT = true

# 首页额外输出 JSON 搜索索引（/index.json），站内搜索用
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 每页显示几篇文章
[pagination]
pagerSize = 10

# 代码高亮配置
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许在 Markdown 里直接写 HTML
      unsafe = true

# XML 不做压缩：RSS 里的 content:encoded 是 CDATA，
# 压缩器会把它转义，导致部分阅读器拿不到全文。
[minify]
  disableXML = true

# 分类法：文章里写 categories / tags / series 会自动生成归档页
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# 相关文章：按标签、分类、系列匹配；threshold 越高越严格
[related]
  threshold = 50
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 50

  [[related.indices]]
    name = "series"
    weight = 80

# ---------------------------------------------------------------------------
# 站点参数
# ---------------------------------------------------------------------------
[params]
  # ★ 你的名字：显示在页头和页脚
  author = "月の眼"

  # ★ 一句话副标题，显示在名字下面
  info = "新世界"

  # 首页名字下面的第二行小字（留空则不显示）
  homeIntro = "杂谈 · 记录"

  # ★ 站点描述，用于 SEO 和 RSS
  description = "月の眼の個人ブログ。新世界を記録する。"

  # 首页 RSS 只输出 posts 分区，避免「归档」「搜索」「关于」混进订阅
  mainSections = ["posts"]

  # SEO 关键词，逗号分隔
  keywords = "blog,技术,笔记,编程"

  # ★ 头像：图片放在 static/images/ 下，这里写相对路径
  #   留空则不显示头像。换头像时直接覆盖 static/images/avatar.jpg 即可
  avatarURL = "images/avatar.jpg"

  # 首页夜空卡片的主视觉图（可选）
  #   留空 = 保持现在的纯夜空
  #   图片放在 assets/images/ 下会自动生成 960 / 1440 / 1920 三种宽度
  #   例：homeHeroImage = "images/hero-night.jpg"
  homeHeroImage = "images/hero-night.jpg"

  # 默认分享封面（1200 × 630）。文章没写 images / featuredImage 时使用。
  # 图片放在 assets/images/ 下，构建时会自动裁切；写外链也可以。
  ogImage = "images/og-default.jpg"

  # 首页「拾光」照片墙显示几张（从 /photos/ 里取）
  homePhotoCount = 4

  # 首页「碎碎念」显示几条（从 /notes/ 里取）
  homeNoteCount = 3

  # 日期显示格式（Go 的时间格式，2006-01-02 就是 年-月-日）
  dateFormat = "2006-01-02"

  # 页脚显示的起始年份
  since = 2026

  # 配色：auto = 跟随系统 / light = 浅色 / dark = 深色
  colorScheme = "auto"

  # 是否隐藏右上角的明暗切换按钮
  hideColorSchemeToggle = false

  # 文章底部"相关文章"最多显示几条
  maxSeeAlsoItems = 5

  # ★ 自定义样式：assets/scss/custom.scss
  #   排版微调（行宽、行高、导航间距）都写在这个文件里，改完保存即可
  customSCSS = ["scss/custom.scss"]

  # ★ 全局 UI 脚本：移动端菜单、状态栏主题色、悬浮按钮自动收起
  #   代码在 assets/js/ui.js，由主题在 </body> 前加载
  customJS = ["js/ui.js"]

  # 文章目录：默认开启，默认收起；单篇文章可在 front matter 写 toc = false 关掉
  [params.entry]
    toc = true
    tocOpen = false

# ---------------------------------------------------------------------------
# 整页背景图（预留口子，默认关闭）
#
# 想让全站文字后面有一层模糊的照片底片，把 image 填成：
#   image = "images/page-background.jpg"
# 图片放在 static/images/ 下。默认模糊 18px、盖 90% 纸色，只留一点影子。
# 单篇文章也可以在自己的 front matter 里写 backgroundImage 覆盖全站设置。
# ---------------------------------------------------------------------------
[params.pageBackground]
  image = ""
  blur = 18
  scrim = 0.9

# ---------------------------------------------------------------------------
# 网易云音乐播放器（左下角悬浮）
#   留空 = 不显示播放器
#   歌单 ID：网页版歌单地址 https://music.163.com/#/playlist?id=123456789
#   单曲 ID：歌曲地址 https://music.163.com/#/song?id=123456
#   两个都填时优先歌单；autoPlay 保持 false 最稳（浏览器会拦自动播放）
# ---------------------------------------------------------------------------
[params.netease]
  playlistID = "14210621640"
  songID = ""
  autoPlay = false

