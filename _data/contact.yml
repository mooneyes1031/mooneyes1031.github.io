# 侧边栏底部的联系方式图标。
# 图标来自 Font Awesome › https://fontawesome.com/

- type: github
  icon: "fab fa-github"

- type: twitter
  icon: "fa-brands fa-x-twitter"

- type: email
  icon: "fas fa-envelope"
  noblank: true # 在当前标签页打开（mailto 链接）

- type: rss
  icon: "fas fa-rss"
  noblank: true

