{{ define "title" }}
  {{ .Title }} · {{ .Site.Title }}
{{ end }}
{{ define "content" }}
  <section class="container page photos-page">
    <article>
      <header>
        <h1 class="title">
          <a class="title-link" href="{{ .Permalink | safeURL }}">{{ .Title }}</a>
        </h1>
      </header>

      {{ .Content }}

      {{ partial "photo-wall.html" . }}
    </article>
  </section>
{{ end }}
