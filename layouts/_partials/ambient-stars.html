{{/*
  首页星空粒子网络
  - 小星点缓慢漂移，鼠标靠近时和星点连线
  - 只在首页显示，固定在正文后面，不挡点击
  - 系统开启“减少动态效果”时隐藏
*/}}
<canvas class="ambient-stars" data-ambient-stars aria-hidden="true"></canvas>
{{- with resources.Get "js/ambient-stars.js" }}
  {{- if hugo.IsServer }}
    <script src="{{ .RelPermalink }}" defer></script>
  {{- else }}
    {{- $js := . | resources.Minify | resources.Fingerprint }}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{- end }}
{{- end }}
