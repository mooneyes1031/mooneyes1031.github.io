{{- $giscus := .Site.Params.giscus -}}
{{- if and $giscus $giscus.repo $giscus.categoryID (eq (.Params.disableComments | default false) false) -}}
  <div class="comments-wrap">
    <h2 class="comments-title">
      <i class="fa-regular fa-comments" aria-hidden="true"></i>
      {{ .Params.commentsTitle | default "评论" }}
    </h2>
    {{- if ne .Type "guestbook" }}
    <p class="comments-hint">
      使用 GitHub 账号登录后即可评论。也可以去
      <a href="{{ "guestbook/" | relLangURL }}">留言板</a> 随便聊聊。
    </p>
    {{- end }}
    <div class="comments" id="comments"></div>
    <script>
      (function () {
        var theme = window.localStorage && window.localStorage.getItem("colorscheme");
        theme = theme || "preferred_color_scheme";

        var script = document.createElement("script");
        script.src = "https://giscus.app/client.js";
        script.setAttribute("data-repo", "{{ $giscus.repo }}");
        script.setAttribute("data-repo-id", "{{ $giscus.repoID }}");
        script.setAttribute("data-category", "{{ $giscus.category }}");
        script.setAttribute("data-category-id", "{{ $giscus.categoryID }}");
        script.setAttribute("data-mapping", "{{ $giscus.mapping | default "pathname" }}");
        script.setAttribute("data-strict", "{{ $giscus.strict | default "0" }}");
        script.setAttribute("data-reactions-enabled", "{{ $giscus.reactionsEnabled | default "1" }}");
        script.setAttribute("data-emit-metadata", "{{ $giscus.emitMetadata | default "0" }}");
        script.setAttribute("data-input-position", "{{ $giscus.inputPosition | default "bottom" }}");
        script.setAttribute("data-theme", theme);
        script.setAttribute("data-lang", "{{ $giscus.lang | default "zh-CN" }}");
        script.setAttribute("data-loading", "{{ $giscus.loading | default "lazy" }}");
        script.setAttribute("crossorigin", "anonymous");
        script.setAttribute("async", "");
        document.getElementById("comments").appendChild(script);
      })();
    </script>
  </div>
{{- end -}}
