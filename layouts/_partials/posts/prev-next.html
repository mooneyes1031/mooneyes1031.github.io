{{- $prev := .PrevInSection -}}
{{- $next := .NextInSection -}}
{{- if or $prev $next }}
<nav class="post-nav" aria-label="文章导航">
  {{ with $prev }}
    <a class="post-nav-item post-nav-prev" href="{{ .RelPermalink }}">
      <span class="post-nav-label"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> 上一篇</span>
      <span class="post-nav-title">{{ .Title }}</span>
    </a>
  {{ end }}
  {{ with $next }}
    <a class="post-nav-item post-nav-next" href="{{ .RelPermalink }}">
      <span class="post-nav-label">下一篇 <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
      <span class="post-nav-title">{{ .Title }}</span>
    </a>
  {{ end }}
</nav>
{{- end -}}
