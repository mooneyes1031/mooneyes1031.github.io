{{/*
  主题的 <head> 扩展点（覆盖主题同名空文件）。
  目前放季节主题色、页面转场兼容标记和结构化数据 JSON-LD。
*/}}
<script>
  (function () {
    // 让手机浏览器的状态栏颜色跟随当前主题，避免深色页面顶部还是浅色。
    try {
      var savedTheme = window.localStorage.getItem("colorscheme");
      var configured = "{{ .Site.Params.colorScheme | default "auto" }}";
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var isDark = savedTheme === "dark" ||
        (savedTheme !== "light" && (configured === "dark" || (configured !== "light" && prefersDark)));
      var meta = document.getElementById("theme-color-meta");
      if (meta) meta.setAttribute("content", isDark ? "#212121" : "#fafafa");
    } catch (error) {
      // 隐私模式下 localStorage 可能不可用，保持默认浅色即可
    }

    var month = new Date().getMonth() + 1;
    var season = "winter";
    if (month >= 3 && month <= 5) season = "spring";
    else if (month >= 6 && month <= 8) season = "summer";
    else if (month >= 9 && month <= 11) season = "autumn";
    document.documentElement.setAttribute("data-season", season);

    // Safari 18.0–18.1 有同文档转场，但没有跨文档 @view-transition。
    // 用 CSSViewTransitionRule 判断，给这些浏览器退回正文淡入。
    if (!("CSSViewTransitionRule" in window)) {
      document.documentElement.classList.add("no-cross-doc-vt");
    }
  })();
</script>
