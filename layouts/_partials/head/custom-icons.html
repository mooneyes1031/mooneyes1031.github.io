{{/*
  站点图标（覆盖主题同名文件）

  - favicon.svg：主图标，支持任意尺寸
  - favicon-32x32.png / favicon-16x16.png：旧浏览器与固定尺寸回退
  - apple-touch-icon.png：iOS 添加到主屏幕时使用（180×180）

  改图标时替换 static/images/ 下这几个文件；如果浏览器缓存不更新，
  把下面的 $iconVersion 改成一个新日期即可。
*/}}
{{- $iconVersion := "20261104" -}}
<link rel="icon" type="image/svg+xml" href="{{ printf "%s?v=%s" (.Site.Params.faviconSVG | default "/images/favicon.svg") $iconVersion | relURL }}" sizes="any">
<link rel="icon" type="image/png" href="{{ printf "%s?v=%s" (.Site.Params.favicon_32 | default "/images/favicon-32x32.png") $iconVersion | relURL }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ printf "%s?v=%s" (.Site.Params.favicon_16 | default "/images/favicon-16x16.png") $iconVersion | relURL }}" sizes="16x16">
<link rel="apple-touch-icon" sizes="180x180" href="{{ printf "%s?v=%s" (.Site.Params.touchicon | default "/images/apple-touch-icon.png") $iconVersion | relURL }}">
