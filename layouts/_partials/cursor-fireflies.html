{{/*
  鼠标萤火拖尾
  - 固定在内容上方、导航和悬浮按钮下方，不挡点击
  - 只在桌面精确指针下出现，手机和减少动态效果时隐藏
*/}}
<canvas class="cursor-fireflies" data-cursor-fireflies aria-hidden="true"></canvas>
{{- with resources.Get "js/cursor-fireflies.js" }}
  {{- if hugo.IsServer }}
    <script src="{{ .RelPermalink }}" defer></script>
  {{- else }}
    {{- $js := . | resources.Minify | resources.Fingerprint }}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{- end }}
{{- end }}
